name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun test
      - run: bun run build

  package:
    name: Package on Node ${{ matrix.node }}
    needs: check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - run: bun install --frozen-lockfile
      - name: Pack
        run: npm pack --pack-destination "$RUNNER_TEMP"
      - name: Install the tarball into a scratch project and run it
        run: |
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          echo '{"compilerOptions":{"strict":true},"include":["*.ts"]}' > tsconfig.json
          echo 'export const hello = "world";' > index.ts
          npm install --no-audit --no-fund "$RUNNER_TEMP"/verumap-*.tgz
          npx verumap | tee out.txt
          grep -q "Source files: 1" out.txt
